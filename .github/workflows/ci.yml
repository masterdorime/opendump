name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    # The code paths are Windows-specific, so the suite runs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Typecheck, tests and the Vite build never launch Electron, so the
          # ~100 MB runtime download is skipped.
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
